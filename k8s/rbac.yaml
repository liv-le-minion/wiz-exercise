apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky-sa
  namespace: tasky
---
# INTENTIONAL: app gets cluster-wide admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-cluster-admin
subjects:
  - kind: ServiceAccount
    name: tasky-sa
    namespace: tasky
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
